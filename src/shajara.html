  for (const f of Lt.families) o.push(`<path d="${linkPath(f, 30)}" stroke="url(#wg)" stroke-width="4.4"/>`);
  for (const m of Lt.marriages) o.push(`<path d="M${F(m.x1 - 4)} ${F(m.y)}H${F(m.x2 + 4)}" stroke="${C.goldD}" stroke-width="8.5"/><path d="M${F(m.x1 - 4)} ${F(m.y)}H${F(m.x2 + 4)}" stroke="url(#wg)" stroke-width="4.4"/>`);
  o.push(`</g>`);

    for (const k of f.kids) o.push(`<circle cx="${F(treeX + k.x)}" cy="${F(treeY + k.y - 16)}" r="9" fill="${C.ivory}" stroke="${C.gold}" stroke-width="3.2"/>`);
    o.push(leaf(treeX + f.ax, treeY + f.ay + 18, 52, .75, C.em3) + leaf(treeX + f.ax, treeY + f.ay + 18, 128, .75, C.em));
  }

    o.push(`<path d="${arch(px, py, D.pw, D.ph)}" fill="none" stroke="${acc}" stroke-width="3.6"/>`);
    o.push(`<path d="${starPath(cx, py - 24, 13)}" fill="url(#wg)"/>`);

  o.push(`<path fill="${C.mut}" d="${tp(FONT.gR, foot, midX, fy + 142, 24, { tracking: 3 }).d}"/>`);

  progress(1);

}

    } catch(e){ $("pxMsg").textContent = t("pErr", { e: e?.message || e }); return null; }
    finally { $("pxMake").disabled = $("pxSave").disabled = false; $("pxProg").hidden = true; }
  };
  $("pxMake").onclick = make;
  if (tab === "poster") setTimeout(make, 60);
  $("pxSave").onclick = async () => { const r = await make(); if (!r) return;
    const slug = (norm(r.opt.title).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "shajara");
    await saveFile(`${slug}-${r.opt.paper === "auto" ? "plakat" : r.opt.paper}.svg`, r.blob); };
  $("calCsv").onclick = () => saveFile("shajara-google-calendar.csv", buildCsv());
  $("calIcs").onclick = () => saveFile("shajara-kalendar.zip", makeZip([{ name:"shajara.ics", data:buildIcs() }]));
  $("bkSave").onclick = () => {
    const data = { app:"shajara", version:2, exportedAt:new Date().toISOString(), meta:S.meta, people:[...S.people.values()], groups:[...S.groups.values()] };
    saveFile(`shajara-zaxira-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(data, null, 2));
  };
  if ($("bkFile")) $("bkFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch(x){ data = null; }
    const ok = data && data.app === "shajara" && Array.isArray(data.people) && data.people.every(p => p && typeof p.id === "string" && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(p.id) && typeof p.firstName === "string");
    const msg = $("bkMsg");
    if (!ok){ msg.innerHTML = `<p class="err">${esc(t("bkBad"))}</p>`; return; }
    msg.innerHTML = `<div class="relbox"><b style="font-size:19px">${esc(t("bkConfirm", { n:data.people.length }))}</b><div class="actions" style="margin-top:10px"><button class="btn danger armed" id="bkYes">${esc(t("bkYes"))}</button><button class="btn" id="bkNo">${esc(t("cancel"))}</button></div></div>`;
    $("bkNo").onclick = () => msg.innerHTML = "";
    $("bkYes").onclick = async () => {
      $("bkYes").disabled = true;
      try {
        for (const p of data.people){ const { id, ...rest } = p; await ref(id).set(rest); }
        for (const g of (Array.isArray(data.groups) ? data.groups : [])){ if (g && typeof g.id === "string"){ const { id, ...rest } = g; await S.db.collection("groups").doc(id).set(rest); } }
        if (data.meta && typeof data.meta === "object" && !Array.isArray(data.meta)) await S.db.doc("meta/info").set({ ...data.meta });
        msg.innerHTML = `<p class="note">${esc(t("bkDone", { n:data.people.length }))}</p>`;
      } catch(x){ msg.innerHTML = `<p class="err">${esc(t("errSave"))}</p>`; }
    };
  };
}

/* ================= Title editing ================= */
function editTitle(){
  const row = $("titleRow"), cur = S.meta.title || L.defTitle;
  row.innerHTML = `<input class="title-input" id="tIn" value="${esc(dn(cur))}" aria-label="${esc(t("inTitle"))}">`;
  const inp = $("tIn"); inp.focus(); inp.select();
  let fin = false;
  const done = async save => {
    if (fin) return; fin = true; const v = inp.value.trim();
    row.innerHTML = `<h1 id="title"></h1><button class="icon-btn" id="titleEditBtn" aria-label="${esc(t("inTitle"))}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>`;
    $("titleEditBtn").onclick = editTitle;
    if (save && v && v !== dn(cur)){ try { await S.db.doc("meta/info").set({ ...S.meta, title:v }); } catch(e){ toast(t("errSave")); } }
    renderChrome();
  };
  inp.onkeydown = e => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); };
  inp.onblur = () => done(true);
}
$("titleEditBtn").onclick = editTitle;

/* ================= Events ================= */
PZ.st.addEventListener("click", e => {
  const add = e.target.closest("[data-add]");
  if (add){ addRelative(add.dataset.child, add.dataset.add); return; }
  const qb = e.target.closest("[data-qa-act]");
  if (qb){ const id = qb.closest(".qa").dataset.qa, act = qb.dataset.qaAct;
    if (act === "fan"){ S.focusId = id; S.selId = id; setView("fan"); }
    else if (act === "me"){ setMe(id); const r = qb.getBoundingClientRect(); Confetti.burst(r.left + r.width / 2, r.top + r.height / 2, 70); }
    else if (act === "add") addRelative(id, "child");
    else if (act === "link") shareLink(id);
    return; }
  const gh = e.target.closest("[data-ghost]");
  if (gh){ const id = gh.dataset.ghost; S.selId = id; render(); locate(id); return; }
  const tg = e.target.closest("[data-tog]");
  if (tg){ const id = tg.dataset.tog; S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id); render(true); return; }
  const up = e.target.closest("[data-up]");
  if (up){ const id = up.dataset.up; S.rootId = topOf(id); S.page = 0; S.selId = id; render(true); locate(id); return; }
  const el = e.target.closest("[data-id]"); if (!el) return;
  const id = el.dataset.id;
  if (S.view === "fan" && S.selId === id && id !== S.focusId){ S.focusId = id; render(true); return; }
  select(id, false);
});
PZ.st.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest(".card"); if (!el || !/^Arrow(Left|Right|Up|Down)$/.test(e.key)) return;
  const mid = c => ({ x:c.offsetLeft + c.offsetWidth / 2, y:c.offsetTop + c.offsetHeight / 2 }), me = mid(el); let best = null, bd = 1e9;
  for (const c of PZ.st.querySelectorAll(".card")){ if (c === el) continue; const q = mid(c), dx = q.x - me.x, dy = q.y - me.y;
    const ok = e.key === "ArrowLeft" ? Math.abs(dy) < 24 && dx < 0 : e.key === "ArrowRight" ? Math.abs(dy) < 24 && dx > 0 : e.key === "ArrowUp" ? dy < -24 : dy > 24;
    if (!ok) continue; const d = e.key === "ArrowUp" || e.key === "ArrowDown" ? Math.abs(dy) * 3 + Math.abs(dx) : Math.abs(dx); if (d < bd){ bd = d; best = c; } }
  if (!best) return; e.preventDefault(); best.focus({ preventScroll:true });
  const r = best.getBoundingClientRect(), v = PZ.vp.getBoundingClientRect(); if (r.left < v.left + 20 || r.right > v.right - PZ.side() - 20 || r.top < v.top + 70 || r.bottom > v.bottom - 20) PZ.centerOn(best);
});
PZ.st.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("g[role=button]")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles:true })); } });
const setView = v => { S.view = v; if (v !== "profile") store.set("shajara.view", v); setMenu(false); render(true); if (S.selId && !PLAIN.has(v)) locate(S.selId); };
$("vTree").onclick = () => setView("tree");
$("pageMode").onclick = () => { S.paged = !S.paged; store.set("shajara.paged", S.paged ? "1" : "0"); if (S.paged){ const pi = S.selId ? pageOfPerson(treePages(), S.selId) : -1; S.page = pi >= 0 ? pi : 0; } render(true); };
$("pgPrev").onclick = () => { S.page = Math.max(0, (S.page || 0) - 1); render(true); };
$("pgNext").onclick = () => { S.page = (S.page || 0) + 1; render(true); };
document.addEventListener("keydown", e => {
  if (!S.paged || S.view !== "tree" || !$("modal").hidden || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || "")) return;
  if (e.key === "ArrowLeft" && S.page > 0){ S.page--; render(true); }
  if (e.key === "ArrowRight" && S.page < (S._pages || []).length - 1){ S.page++; render(true); }
});
$("vFan").onclick = () => { if (S.selId) S.focusId = S.selId; setView("fan"); };
$("vList").onclick = () => setView("list");
$("vHome").onclick = () => setView("home"); $("vBday").onclick = () => setView("bday"); $("vCircles").onclick = () => setView("circles"); $("vTime").onclick = () => setView("time"); $("vPhotos").onclick = () => setView("photos");
$("scLat").onclick = () => { S.script = "lat"; store.set("shajara.script", "lat"); render(); };
$("scCyr").onclick = () => { S.script = "cyr"; store.set("shajara.script", "cyr"); render(); };
$("genSel").onchange = e => { S.maxGen = +e.target.value || 0; store.set("shajara.maxgen", S.maxGen ? String(S.maxGen) : null); S.page = 0; render(true); };
$("pick").onchange = e => { if (S.view === "tree"){ S.rootId = e.target.value; S.page = 0; } else S.focusId = e.target.value; render(true); };
$("addBtn").onclick = () => openForm(null, {});
$("exportBtn").onclick = () => openExport("poster");
$("todayBtn").onclick = () => setView("bday");
$("setBtn").onclick = openSettings; $("themeBtn").onclick = Theme.toggle; $("shareBtn").onclick = () => shareLink(null);
$("toTop").onclick = () => $("list").scrollTo({ top:0, behavior:reduceMotion() ? "auto" : "smooth" });
$("list").addEventListener("scroll", updScroll, { passive:true });
tilt($("stage"), ".card"); tilt($("list"), ".mcard,.hs,.mini");
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("modal").hidden && S.selId && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || "")){ S.selId = null; render(); } });
$("meChip").onclick = () => { if (P(S.meId)) select(S.meId, true); else toast(t("meHint")); };
const q = $("q"), res = $("results");
q.oninput = () => {
  if (S.view === "list"){ renderList(); res.hidden = true; return; }
  const s = norm(q.value.trim()); if (!s){ res.hidden = true; return; }
  const hits = [...S.people.values()].filter(p => norm([p.firstName, p.lastName, p.patronymic].join(" ")).includes(s)).slice(0, 8);
  res.innerHTML = hits.length ? hits.map(p => `<button data-hit="${esc(p.id)}">${avatar(p)}<span><b>${esc(short(p))}</b><br><small>${esc(yrs(p))}${isCircle(p) ? " · " + esc(t("cFriendTag")) : ""}</small></span></button>`).join("") : `<div class="empty">—</div>`;
  res.hidden = false;
  res.querySelectorAll("[data-hit]").forEach(b => b.onclick = () => { res.hidden = true; q.value = ""; if (S.view === "fan") S.focusId = b.dataset.hit; select(b.dataset.hit, true); });
};
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (!$("modal").hidden){ $("modal").hidden = true; $("modal").innerHTML = ""; } else if (S.selId){ S.selId = null; render(); } } });
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(() => { if (!PLAIN.has(S.view)) PZ.fit(); }, 150); });

/* ================= Phone menu ================= */
function setMenu(open){ const app = document.querySelector(".app"); app.classList.toggle("menu-open", open); $("scrim").hidden = !open; $("menuBtn").setAttribute("aria-expanded", open); }
$("menuBtn").onclick = () => setMenu(!document.querySelector(".app").classList.contains("menu-open"));
$("scrim").onclick = () => setMenu(false);
["vHome","vTree","vFan","vList","vTime","vBday","vCircles","vPhotos","exportBtn","todayBtn","meChip"].forEach(id => $(id).addEventListener("click", () => setMenu(false)));
document.querySelector(".app").addEventListener("wheel", e => { if (e.ctrlKey && !PZ.vp.contains(e.target)) e.preventDefault(); }, { passive:false });
["gesturestart", "gesturechange"].forEach(n => document.addEventListener(n, e => { if (e.target.closest && e.target.closest(".app")) e.preventDefault(); }, { passive:false }));
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){ e.preventDefault(); $("q").focus(); } });

/* ================= Boot ================= */
S.script = store.get("shajara.script") === "cyr" ? "cyr" : "lat";
S.view = ["home","tree","fan","list","time","bday","circles","photos"].includes(store.get("shajara.view")) ? store.get("shajara.view") : "home";
S.paged = store.get("shajara.paged") ? store.get("shajara.paged") === "1" : window.innerWidth < 700; S.page = 0;
Theme.init(); renderChrome(); FX.start();
(async () => {
  const claude = window.claude;
  const noAccess = () => { S.loaded = true; $("state").innerHTML = `<div class="box"><svg class="mark" aria-hidden="true"><use href="#star"/></svg><p>${esc(t("signin"))}</p></div>`; };
  if (!claude || !claude.use){ noAccess(); return; }
  const [db, user, assets, downloads] = await Promise.all(["db","user","assets","downloads"].map(n => Promise.resolve(claude.use(n)).catch(() => null)));
  if (!db){ noAccess(); return; }
  S.db = db; S.assets = assets; S.downloads = downloads;
  S.canEdit = user ? await user.canEdit() : false;
  S.isOwner = user ? await user.isOwner() : false;
  S.perms = window.SJ && SJ.perms ? SJ.perms : null; S.locked = !!(window.SJ && SJ.locked);
  S.canFam = S.isOwner || !S.perms ? S.canEdit : S.perms.family === "edit"; S.canCirc = S.isOwner || !S.perms ? S.canEdit : S.perms.circles === "edit";
  S.famNone = !!(S.perms && !S.isOwner && S.perms.family === "none");
  S.meId = store.get("shajara.me");
  db.doc("meta/info").onSnapshot(snap => {
    S.meta = snap.exists ? { ...snap.data() } : {};
    if (!S.meId && S.isOwner && S.meta.meId){ S.meId = S.meta.meId; if (S.loaded) render(); }
    renderChrome();
  }, () => {});
  db.collection("groups").onSnapshot(snap => { S.groups = new Map(snap.docs.map(d => [d.id, { id:d.id, ...d.data() }])); if (S.loaded) render(); }, () => {});
  db.collection("people").onSnapshot(snap => {
    S.people = new Map(snap.docs.map(d => [d.id, { id:d.id, ...d.data() }]));
    if (S.meId && !P(S.meId)) S.meId = null;
    const firstLoad = !S.loaded; S.loaded = true; S.locked = !!(window.SJ && SJ.locked); render(firstLoad); if (firstLoad) openHash();
  }, () => { S.loaded = true; $("state").hidden = false; $("state").innerHTML = `<div class="box"><p>${esc(t("errSave"))}</p></div>`; });
})();
</script>
